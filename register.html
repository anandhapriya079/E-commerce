<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            ShopEasy
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                🛒 Cart
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Register -->

    <section class="login-section">

        <div class="login-box">

            <h1>
                Create Account
            </h1>

            <p>
                Join ShopEasy today
            </p>


            <form onsubmit="registerUser(event)">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 ShopEasy.
            All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
