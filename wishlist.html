<!DOCTYPE html>

            </button>

        </div>

        <nav class="nav-links">

            </a>

            <a href="products.html">

            </a>

            </a>

            <a href="cart.html">

        </nav>

    <!-- Wishlist -->

    <section class="wishlist-section">

        <h1>
            My Wishlist ❤️
        </h1>

        <div id="wishlist-items">

    <!-- Footer -->

    <footer>

            All Rights Reserved.
        </p>
