<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Online Shopping</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            ShopEasy
        </div>


        <div class="search-box">

            <input
                type="text"
                placeholder="Search products...">

            <button>
                🔍
            </button>

        </div>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>
            <a href="orders.html">
            📦 Orders
            </a>
            <div id="user-status"></div>

            <a href="#">
                🛒 Cart
            </a>

        </nav>

    </header>


    <!-- Hero Section -->

    <section class="hero">

        <div>

            <h1>
                Welcome to ShopEasy
            </h1>

            <p>
                Discover amazing products at great prices
            </p>

            <button class="shop-button">
                Shop Now
            </button>

        </div>

    </section>


    <!-- Categories -->

    <section class="categories">

        <h2>
            Shop by Category
        </h2>


        <div class="category-container">


            <div class="category-card">

                <div class="category-icon">
                    📱
                </div>

                <h3>
                    Electronics
                </h3>

            </div>


            <div class="category-card">

                <div class="category-icon">
                    👕
                </div>

                <h3>
                    Fashion
                </h3>

            </div>


            <div class="category-card">

                <div class="category-icon">
                    👟
                </div>

                <h3>
                    Footwear
                </h3>

            </div>


            <div class="category-card">

                <div class="category-icon">
                    🏠
                </div>

                <h3>
                    Home
                </h3>

            </div>


            <div class="category-card">

                <div class="category-icon">
                    📚
                </div>

                <h3>
                    Books
                </h3>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEasy.
            All Rights Reserved.
        </p>

    </footer>


</body>

</html>
