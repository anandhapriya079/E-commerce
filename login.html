<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Login</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            ShopEasy
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                🛒 Cart
            </a>

        </nav>

    </header>


    <!-- Login -->

    <section class="login-section">

        <div class="login-box">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your ShopEasy account
            </p>


            <form onsubmit="loginUser(event)">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 ShopEasy.
            All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
